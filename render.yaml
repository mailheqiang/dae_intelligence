services:
  - type: web
    name: dae-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python demo系统/backend/server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DAE_ADMIN_PASSWORD
        sync: false
